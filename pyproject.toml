[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-investment-memory"
version = "0.2.0"
description = "Source-grounded investor investment wikis generated with Sol"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
full = ["pypdf>=5,<7"]

[project.scripts]
investor-memory = "wiki_build.__main__:main"

[tool.setuptools]
packages = ["wiki_build"]

[tool.setuptools.package-data]
wiki_build = ["taxonomy.json", "AGENT.md", "FULL_AGENT.md"]
